name: Publish Pre-release Extension

on:
  release:
    types: [prereleased]

  workflow_dispatch:
    inputs:
      publish_build:
        description: "Whether or not to publish the built extension to the VS Code marketplace"
        required: true
        default: "false"
      enable_retry:
        description: "A) Retry flaky native-binary downloads (ripgrep/sqlite). Opt-in. Default false = original behaviour."
        required: false
        type: boolean
        default: false
      force_build:
        description: "B) Do not let a single failing target cancel the whole build/release. Opt-out. Default true = force enabled (also for tag-triggered runs)."
        required: false
        type: boolean
        default: true

jobs:
  check_release_name:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        working-directory: .
        run: |
          if [[ "${{ github.event.release.tag_name }}" == v*.*.*-preview.*-vscode ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_release_name
    if: needs.check_release_name.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      # Default is true: GitHub cancels every still-running matrix job when one
      # combination fails. That masks which targets are actually buildable and
      # cancels jobs that would otherwise have succeeded (observed: darwin-x64
      # was cancelled the moment win32-arm64 failed). false lets each target run
      # to completion; the per-target continue-on-error then handles its failure.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          # win32-arm64 DISABLED: @vscode/ripgrep ships no prebuilt `rg.exe`
          # binary for win32-arm64, so package.js validateOutput throws. Confirmed
          # deterministic (same error on 3 isolated re-runs), not a flaky download.
          # - os: windows-latest
          #   platform: win32
          #   arch: arm64
          #   npm_config_arch: arm
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          # linux-arm64 DISABLED: runner is x64, core installs linux-x64 native
          # bindings (ripgrep/sqlite); no prebuilt arm64 binary available to copy
          # into out/, so package.js validateOutput throws. Re-enable only with an
          # arm64 runner or prebuilt arm64 native modules.
          # - os: ubuntu-latest
          #   platform: linux
          #   arch: arm64
          #   npm_config_arch: arm64
          # linux-armhf DISABLED: @vscode/ripgrep ships no prebuilt `rg` binary
          # for armhf, so the build can't be packaged (the build job would fail
          # and block the whole release). Re-enable only if ripgrep gains armhf.
          # - os: ubuntu-latest
          #   platform: linux
          #   arch: armhf
          #   npm_config_arch: arm
          - os: ubuntu-latest
            platform: alpine
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Configure force-build
        # B (opt-out) computed into a clean boolean so continue-on-error never
        # references `inputs` directly (which is empty for tag-triggered runs).
        # Default: ON for release-triggered runs and for dispatch unless
        # force_build=false is explicitly chosen.
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.force_build }}" != "false" ]; then
            echo "coe=true" >> "$GITHUB_OUTPUT"
          else
            echo "coe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-vscode-extension
        continue-on-error: ${{ steps.cfg.outputs.coe == 'true' }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
          pre-release: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-retry: ${{ inputs.enable_retry }}

      - name: Upload .vsix artifact
        # Upload whatever was produced; if this target failed, there is simply
        # no file and the step is a no-op (so the job stays green for the others).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-vsix
          path: "extensions/vscode/*.vsix"
          if-no-files-found: ignore

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - build
    # B: ship whatever targets built even if one matrix target failed or was
    # cancelled (e.g. no macOS runner available for darwin-x64). !cancelled()
    # still skips the job if the whole workflow run is cancelled by a person.
    # The Build summary step lists which targets are MISSING.
    # Wrapped in ${{ }} so a strict YAML parser doesn't read the leading "!" as
    # a YAML tag; GitHub evaluates it as a job expression either way.
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Download the .vsix artifacts (merged into one folder for the Release step)
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      # Separately, download UNMERGED so each target's artifact keeps its own
      # folder (named "<platform>-<arch>-vsix", which WE control). The summary
      # detects targets from these folders instead of guessing the vsce file name
      # (the merged folder has opaque filenames, which made the old summary
      # wrongly report every target as MISSING).
      - name: Download per-target artifacts (for summary only)
        uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-by-target
          merge-multiple: false

      - name: Build summary (which targets produced a .vsix)
        shell: bash
        run: |
          {
            echo "## Release build summary"
            echo ""
            echo "| Target | .vsix |"
            echo "|---|---|"
            produced=0; missing=0
            for t in \
              "win32-x64" \
              "linux-x64" \
              "alpine-x64" \
              "darwin-x64" "darwin-arm64"; do
              # Each uploaded artifact was named "<target>-vsix"; download-artifact
              # (unmerged) recreates that as a folder. A target only uploaded a
              # folder when its build produced a .vsix, so folder presence is the
              # reliable signal.
              if [ -d "vsix-by-target/${t}-vsix" ]; then
                echo "| $t | yes |"; produced=$((produced+1));
              else
                echo "| $t | MISSING |"; missing=$((missing+1));
              fi
            done
            echo ""
            echo "Produced: $produced  Missing: $missing"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            vsix-artifacts/*.vsix
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
    if: (!cancelled()) && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_build == 'true')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 0. Setup git
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Pull latest changes from release
        run: git fetch origin ${{ github.ref }} && git checkout ${{ github.ref }}

      # 1. Download the artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-vsix"
          path: vsix-artifacts
          merge-multiple: true

      # 2. Publish the extension to VS Code Marketplace
      - name: Publish to VS Code Marketplace
        run: |
          cd extensions/vscode
          npx @vscode/vsce publish --pre-release --packagePath ../../vsix-artifacts/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

      # 3. Publish the extension to Open VSX Registry
      - name: Publish (Open VSX Registry)
        continue-on-error: true
        run: |
          cd extensions/vscode
          npx ovsx publish --pre-release -p ${{ secrets.VSX_REGISTRY_TOKEN }} --packagePath ../../vsix-artifacts/*.vsix

      # 4. Create PR with version bump
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Create PR branch
        run: |
          BRANCH_NAME="chore/bump-vscode-version-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Bump version in package.json
        run: |
          cd extensions/vscode
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          commit-message: "chore: bump vscode extension version to ${{ env.NEW_VERSION }}"
          title: "chore: bump vscode extension version to ${{ env.NEW_VERSION }}"
          body: |
            Automated PR to bump the VS Code extension version after successful pre-release publication.

            - Bumped version in extensions/vscode/package.json to ${{ env.NEW_VERSION }}
          branch: ${{ env.BRANCH_NAME }}
          base: main
          delete-branch: true

      # 5. Update version in package.json
